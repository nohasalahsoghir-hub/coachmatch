name: CoachMatch CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Seed script syntax audit
        run: node --check scripts/seed-real-product.mjs
      - name: Legacy design audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'var\(--(flare|pitch|ink)\)|btn-flare|--(flare|pitch|ink):|#FF6A3D|#040B09' app components lib --include='*.tsx' --include='*.ts' --include='*.css' --include='*.js' --include='*.mjs'; then
            echo 'Legacy design tokens found.'
            exit 1
          fi
          if grep -RniE 'rounded-(4xl|5xl)' app components lib --include='*.tsx' --include='*.ts' --include='*.css'; then
            echo 'Legacy radius tokens found.'
            exit 1
          fi
          echo 'Design audit passed.'
