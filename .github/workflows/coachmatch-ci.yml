name: CoachMatch CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Seed script syntax audit
        run: node --check scripts/seed-real-product.mjs
      - name: Legacy design audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'var\(--(flare|pitch|ink)\)|btn-flare|--(flare|pitch|ink):|#FF6A3D|#040B09' app components lib --include='*.tsx' --include='*.ts' --include='*.css' --include='*.js' --include='*.mjs'; then
            echo 'Legacy design tokens found.'
            exit 1
          fi
          if grep -RniE 'rounded-(4xl|5xl)' app components lib --include='*.tsx' --include='*.ts' --include='*.css'; then
            echo 'Legacy radius tokens found.'
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const roots = ["app", "components", "lib"];
          const banned = ["اختاري","اكتشفي","ابدئي","أضيفي","استخدمي","راجعي","جربي","تأكدي","حاولي","اكتبي","اطلبي","فعّلي","تعيدي","سجّلي","عايزة"];
          const matches = [];
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const file = path.join(dir, name);
              const stat = fs.statSync(file);
              if (stat.isDirectory()) walk(file);
              else if (/\.(tsx|ts|css)$/.test(name)) {
                const text = fs.readFileSync(file, "utf8");
                for (const term of banned) if (text.includes(term)) matches.push({ file, term });
              }
            }
          }
          for (const root of roots) walk(root);
          if (matches.length) {
            console.error("Gendered Arabic user-facing copy found:", JSON.stringify(matches, null, 2));
            process.exit(1);
          }
          console.log("Gender-neutral Arabic copy audit passed.");
          NODE
          echo 'Design audit passed.'
